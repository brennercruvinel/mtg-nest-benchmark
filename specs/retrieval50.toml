# mtgdataset v0.3 candidate — retrieval-only at FIXED crf50.
# RESULTS.md §13 measured no utility loss at crf40 (txt@1 parity with the
# lossless archive) while drift p10 sits at 0.932; crf50 costs drift 0.896
# and its txt@1 was never measured. This build answers that question with a
# fixed crf — no gate — so the bench isolates the codec step alone.
# NOT for serving display-quality images.
#
#   nest build --spec dat/mtg/specs/retrieval50.toml

[corpus]
name = "mtgdataset"
title = "MTG card dataset (retrieval-only crf50, self-contained)"
chunker_version = "mtgdataset/1"
reproducible = true

[source]
kind = "sqlite"
db = "~/Library/Application Support/Spellbook/data/mtg.sqlite"
query = """
SELECT oracle_id, name, mana_cost, type_line, oracle_text, rarity, set_code, image_uri
FROM cards WHERE image_uri IS NOT NULL
"""
order_by = ["img_id", "oracle_id"]

[source.derive]
img_id = "basename_stem(image_uri)"

[[source.joins]]
query = "SELECT oracle_id, printed_name AS pt_name FROM names_localized WHERE lang='pt' AND lang_rank=1"
on = "oracle_id"

[source.text]
template = """
{name} ({pt_name})
{mana_cost}; {type_line}
[{rarity}, {set_code}]
{oracle_text}
"""

[source.image]
path_template = "~/Library/Application Support/Spellbook/data/images/normal/front/{img_id[0]}/{img_id[1]}/{img_id}.jpg"
label_template = "{name}"

[media]
backend = "av1"
crf = 50
tune = "still"
speed = 6
gop = "intra"
order = "none"
shard_size = 40960          # > n_items: um único segmento de vídeo
dedup = true


[[models]]
preset = "potion"
text = "default"

[[models]]
preset = "clip-vit-b32"
image = "space"

[build]
preset = "hybrid"
dtype = "int8"
with_graph = true

[output]
mode = "single"
dir = "dat/mtg/benchmark/candidates/v03-retrieval-crf50"
provenance = "standard"
embed_media = true
